<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buat Panel</title>
<style>
:root{--cream:#FFF3D1;--paper:#FFFBEF;--blue:#2F6BFF;--ink:#121212;--yellow:#FFD84D;--green:#3DDC84;--red:#FF5A5F;--grey:#E7E1CF;--r:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);background-image:radial-gradient(rgba(18,18,18,.12) 1.2px,transparent 1.2px);background-size:20px 20px;color:var(--ink);font:600 15px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
a{color:var(--ink);text-decoration:none}
.top{background:var(--yellow);border-bottom:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{background:var(--blue);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:12px;padding:6px 14px;font:900 16px "Trebuchet MS",system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;transform:rotate(-2deg)}
.sp{flex:1}
.wrap{max-width:980px;margin:0 auto;padding:26px 16px 80px}
h1{font:900 26px "Trebuchet MS",system-ui,sans-serif;margin:0 0 6px}
h2{font:900 16px "Trebuchet MS",system-ui,sans-serif;margin:0 0 14px;text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:8px 8px 0 var(--ink);padding:20px;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.plan{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:6px 6px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.sel{background:var(--yellow)}
.plan.soon{opacity:.55}
.plan .p{font:900 24px "Trebuchet MS",system-ui,sans-serif}
.tag{align-self:flex-start;font-size:12px;font-weight:900;padding:3px 10px;border:2px solid var(--ink);border-radius:99px;background:#fff;text-transform:uppercase}
.tag.free{background:var(--green)}.tag.soon{background:var(--grey)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 16px;font:900 14px "Trebuchet MS",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.3px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:4px 4px 0 var(--ink)}
.btn.yellow{background:var(--yellow);color:var(--ink)}.btn.paper{background:var(--paper);color:var(--ink)}.btn.green{background:var(--green);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12px;box-shadow:3px 3px 0 var(--ink)}
.btn.block{width:100%}
input,select{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font:700 15px "Trebuchet MS",system-ui,sans-serif;color:var(--ink);width:100%;box-shadow:inset 3px 3px 0 rgba(18,18,18,.08)}
input:focus,select:focus{outline:0;box-shadow:0 0 0 4px var(--yellow)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font:900 12px "Trebuchet MS",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 160px}.row>.btn{flex:0 0 auto}
.err{color:#c00000;font-weight:800;min-height:20px;margin-top:8px}
.muted{color:#5a5443;font-weight:600}
code{font:700 12.5px ui-monospace,Menlo,monospace;background:var(--yellow);border:2px solid var(--ink);padding:1px 7px;border-radius:8px;word-break:break-all}
.srv{background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:14px;margin-bottom:16px}
.srv .n{font:900 17px "Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:10px;margin-bottom:16px}
.tabs button{flex:1}
.tabs button.on{background:var(--yellow);color:var(--ink)}
.center{max-width:400px;margin:8vh auto 0}
</style>
</head>
<body>
<header class="top"><span class="brand">Buat Panel</span><span class="sp"></span><a class="btn paper sm" href="/">Dashboard panel</a><button class="btn paper sm" id="out" style="display:none">Keluar</button></header>
<main class="wrap" id="app"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES=[{id:'node',label:'Node.js'},{id:'python',label:'Python'},{id:'web',label:'Web statis'}];
async function api(u,opt={}){
  const h={};let body;let method=opt.method||'GET';
  if(opt.json!==undefined){h['Content-Type']='application/json';body=JSON.stringify(opt.json);method=opt.method||'POST'}
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),15000);let r;
  try{r=await fetch('/api'+u,{method,headers:h,body,credentials:'same-origin',signal:ctl.signal})}
  catch(e){throw new Error(e.name==='AbortError'?'Server tidak merespons. Coba lagi.':'Tidak bisa terhubung ke server')}
  finally{clearTimeout(tm)}
  const ct=r.headers.get('content-type')||'';
  const data=ct.includes('application/json')?await r.json():await r.text();
  if(!r.ok)throw new Error(data&&data.error?data.error:'Gagal ('+r.status+')');
  return data}
let mode='login';
function authView(){
  $('#out').style.display='none';
  $('#app').innerHTML=`<div class="center"><div class="card"><h1>Buat Panel</h1><p class="muted" style="margin:0 0 18px">Daftar atau masuk, lalu pilih paket.</p>
   <div class="tabs"><button class="btn paper sm ${mode==='login'?'on':''}" id="tl">Masuk</button><button class="btn paper sm ${mode==='reg'?'on':''}" id="tr">Daftar</button></div>
   <div class="field"><label>Username</label><input id="u" autocapitalize="off" autocomplete="username"></div>
   <div class="field"><label>Password</label><input id="p" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}"></div>
   <button class="btn block" id="go">${mode==='login'?'Masuk':'Daftar'}</button><div class="err" id="e"></div></div></div>`;
  $('#tl').onclick=()=>{mode='login';authView()};
  $('#tr').onclick=()=>{mode='reg';authView()};
  const go=async()=>{$('#go').disabled=true;try{
    const body={username:$('#u').value.trim(),password:$('#p').value};
    await api(mode==='login'?'/login':'/create/register',{json:body});
    dashView()}catch(e){$('#e').textContent=e.message;$('#go').disabled=false}};
  $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()}}

async function dashView(){
  $('#out').style.display='';
  let plans=[],mine=[];
  try{[plans,mine]=await Promise.all([api('/create/plans'),api('/create/mine')])}
  catch(e){$('#app').innerHTML=`<div class="center"><div class="card"><h2>Gagal memuat</h2><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Muat ulang</button></div></div>`;return}
  $('#app').innerHTML=`
   <div class="card"><h2>Pilih paket</h2>
    <div class="grid">${plans.map((p,i)=>`<div class="plan ${p.status==='soon'?'soon':''} ${i===0?'sel':''}" data-ram="${p.ram}">
      <span class="tag ${p.status==='soon'?'soon':'free'}">${p.status==='soon'?'Coming soon':(p.free?'Gratis':'Aktif')}</span>
      <div class="p">${esc(p.label)}</div><div class="muted">RAM ${p.ram} MB</div>
      ${p.free?'<div class="muted" style="font-size:13px">Dihapus otomatis jika tidak dipakai 5 menit</div>':''}
    </div>`).join('')}</div>
    <div class="row" style="margin-top:20px">
      <div><div class="field" style="margin:0"><label>Tipe</label><select id="ty">${TYPES.map(t=>`<option value="${t.id}">${t.label}</option>`).join('')}</select></div></div>
      <div><div class="field" style="margin:0"><label>Nama server</label><input id="nm" placeholder="Bot saya" maxlength="40"></div></div>
      <button class="btn green" id="mk">Buat panel</button>
    </div>
    <div class="err" id="ce"></div></div>
   <div class="card"><h2>Server kamu (${mine.length})</h2>
    ${mine.map(s=>`<div class="srv"><div class="n"><span>${esc(s.name)}</span><span class="tag ${s.status==='offline'?'soon':'free'}">${s.status==='offline'?'Mati':'Berjalan'}</span></div>
      <div class="muted" style="margin-top:6px">${esc(s.typeLabel)} · RAM ${s.ram} MB${s.autoDelete?' · Gratis':''}</div>
      <div class="muted" style="font-size:13px;margin-top:6px">Link server: <code>${esc(s.siteUrl)}</code></div>
      <div class="acts"><a class="btn sm" href="/#/server/${esc(s.id)}">Buka dashboard</a><button class="btn paper sm" data-copy="${esc(s.siteUrl)}">Salin link</button></div></div>`).join('')||'<p class="muted" style="margin:0">Belum ada server. Pilih paket di atas.</p>'}
   </div>`;
  let pilih=plans[0]?plans[0].ram:0;
  document.querySelectorAll('.plan').forEach(el=>el.onclick=()=>{const p=plans.find(x=>String(x.ram)===el.dataset.ram);if(p&&p.status==='soon')return;
    pilih=+el.dataset.ram;document.querySelectorAll('.plan').forEach(x=>x.classList.toggle('sel',x===el))});
  $('#mk').onclick=async()=>{$('#ce').textContent='';$('#mk').disabled=true;try{
    const s=await api('/create/server',{json:{ram:pilih,type:$('#ty').value,name:$('#nm').value.trim()}});
    alert('Panel dibuat: '+s.name+'\nKode: '+s.id);dashView()}
   catch(e){$('#ce').textContent=e.message;$('#mk').disabled=false}};
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.copy).then(()=>{const t=b.textContent;b.textContent='Tersalin';setTimeout(()=>{b.textContent=t},1200)}).catch(()=>{})})}

$('#out').onclick=async()=>{await api('/logout',{method:'POST',json:{}}).catch(()=>{});mode='login';authView()};
(async()=>{try{await api('/me');dashView()}catch{authView()}})();
</script>
</body>
</html>
