<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toko Panel</title>
<style>
:root{--cream:#FFF3D1;--paper:#FFFBEF;--blue:#2F6BFF;--ink:#121212;--yellow:#FFD84D;--green:#3DDC84;--red:#FF5A5F;--grey:#E7E1CF}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);background-image:radial-gradient(rgba(18,18,18,.12) 1.2px,transparent 1.2px);background-size:20px 20px;color:var(--ink);font:600 15px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
a{color:var(--ink);text-decoration:none}
code{font:700 12.5px ui-monospace,Menlo,monospace;background:var(--yellow);border:2px solid var(--ink);padding:1px 7px;border-radius:8px;word-break:break-all}
h1{font:900 26px "Trebuchet MS",system-ui,sans-serif;margin:0}
h2{font:900 16px "Trebuchet MS",system-ui,sans-serif;margin:0 0 12px;text-transform:uppercase;letter-spacing:.5px}
.muted{color:#5a5443;font-weight:600}
.top{position:sticky;top:0;z-index:20;background:var(--yellow);border-bottom:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:68px;flex-wrap:wrap}
.brand{background:var(--blue);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:12px;padding:6px 14px;font:900 16px "Trebuchet MS",system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;transform:rotate(-2deg)}
.sp{flex:1}
.chip{display:inline-block;font-weight:900;padding:4px 12px;border:3px solid var(--ink);border-radius:99px;background:var(--paper);box-shadow:3px 3px 0 var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:26px 16px 80px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 var(--ink);padding:18px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;margin-bottom:26px}
.plan{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:16px;text-align:center;transition:transform .12s,box-shadow .12s}
.plan:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.plan .gb{font:900 28px "Trebuchet MS",system-ui,sans-serif}
.plan .pr{display:inline-block;margin:8px 0 12px;padding:4px 14px;border:3px solid var(--ink);border-radius:99px;font-weight:900;background:var(--yellow)}
.plan .pr.free{background:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:9px 16px;font:900 14px "Trebuchet MS",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.3px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;white-space:nowrap;text-decoration:none}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.green{background:var(--green);color:var(--ink)}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.red{background:var(--red);color:var(--ink)}
.btn.paper{background:var(--paper);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12px;box-shadow:3px 3px 0 var(--ink)}
.btn.block{width:100%}
input,select{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font:700 15px "Trebuchet MS",system-ui,sans-serif;color:var(--ink);width:100%;min-width:0}
input:focus,select:focus{outline:0;box-shadow:0 0 0 4px var(--yellow)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font:900 13px "Trebuchet MS",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.4px}
.err{color:#c00000;font-weight:800;min-height:20px;margin-top:8px}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form>*{flex:1 1 150px}
.form>.btn{flex:0 0 auto}
.badge{display:inline-block;font-size:12px;font-weight:900;padding:3px 10px;border:2px solid var(--ink);border-radius:99px;background:var(--grey);text-transform:uppercase}
.badge.running{background:var(--green)}
.badge.starting,.badge.stopping{background:var(--yellow)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.tbl th{background:var(--yellow);text-align:left;padding:9px;border-bottom:3px solid var(--ink);font:900 12px "Trebuchet MS",system-ui,sans-serif;text-transform:uppercase}
.tbl td{padding:9px;border-bottom:2px solid var(--ink);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.auth{max-width:420px;margin:8vh auto 0;padding:0 16px}
.auth .card{transform:rotate(-1deg);padding:26px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1}
.tabs button.off{background:var(--paper);color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(18,18,18,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:10px 10px 0 var(--ink);padding:22px;width:100%;max-width:420px}
.modal h3{font:900 20px "Trebuchet MS",system-ui,sans-serif;margin:0 0 14px;text-transform:uppercase}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){.hide-m{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES={node:'Node.js',python:'Python',web:'Web statis'};
const LBL={running:'Berjalan',offline:'Mati',starting:'Memulai',stopping:'Berhenti'};
const badge=s=>`<span class="badge ${esc(s)}">${LBL[s]||esc(s)}</span>`;
let me=null,PLANS=[];
const app=()=>$('#app');

async function api(u,opt={}){
  const h={};let body=opt.body,method=opt.method||'GET';
  if(opt.json!==undefined){h['Content-Type']='application/json';body=JSON.stringify(opt.json);method=opt.method||'POST'}
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),15000);
  let r;
  try{r=await fetch('/api'+u,{method,headers:h,body,credentials:'same-origin',signal:ctl.signal})}
  catch(e){throw new Error(e.name==='AbortError'?'Server tidak merespons. Coba lagi.':'Tidak bisa terhubung ke server')}
  finally{clearTimeout(tm)}
  const ct=r.headers.get('content-type')||'';
  const data=ct.includes('application/json')?await r.json():await r.text();
  if(!r.ok)throw new Error(data&&data.error?data.error:'Gagal ('+r.status+')');
  return data}
const post=(u,j)=>api(u,{json:j||{}});

function modal(title,body,onOk,okText){
  const m=document.createElement('div');m.className='overlay';
  m.innerHTML=`<div class="modal"><h3>${esc(title)}</h3>${body}<div class="err" id="me"></div>
    <div class="row"><button class="btn paper sm" id="mc">Batal</button><button class="btn sm" id="mo">${esc(okText||'Simpan')}</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#mc').onclick=()=>m.remove();
  m.querySelector('#mo').onclick=async()=>{try{await onOk(m)}catch(e){m.querySelector('#me').textContent=e.message}};
  return m}

function authView(mode,err){
  const reg=mode==='register';
  app().innerHTML=`<div class="auth"><div class="card">
   <h1 style="text-align:center;margin-bottom:6px">Toko Panel</h1>
   <p class="muted" style="text-align:center;margin:0 0 18px">Beli server pakai koin</p>
   <div class="tabs"><button class="btn ${reg?'paper':''} ${reg?'off':''}" id="tl">Masuk</button><button class="btn ${reg?'':'paper off'}" id="tr">Daftar</button></div>
   <div class="field"><label>Username</label><input id="u" autocapitalize="off" autocomplete="username"></div>
   <div class="field"><label>Password</label><input id="p" type="password" autocomplete="${reg?'new-password':'current-password'}"></div>
   <button class="btn block" id="go">${reg?'Daftar':'Masuk'}</button>
   <div class="err" id="le">${esc(err||'')}</div>
   ${reg?'<p class="muted" style="font-size:13px;margin:12px 0 0">Setelah daftar, login pertama kali dapat bonus koin.</p>':''}
  </div></div>`;
  $('#tl').onclick=()=>authView('login');$('#tr').onclick=()=>authView('register');
  const go=async()=>{$('#go').disabled=true;try{
    if(reg){await api('/register',{json:{username:$('#u').value.trim(),password:$('#p').value}})}
    const r=await api('/login',{json:{username:$('#u').value.trim(),password:$('#p').value}});
    if(r.bonus)alert('Selamat! Bonus '+r.bonus+' koin sudah masuk.');
    boot()}catch(e){$('#le').textContent=e.message;$('#go').disabled=false}};
  $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()}}

async function boot(){
  try{me=await api('/me')}catch(e){me=null;return authView('login',e.message&&e.message!=='Belum login'?e.message:'')}
  try{PLANS=await api('/plans')}catch{PLANS=[]}
  shopView()}

async function shopView(){
  let list=[];
  try{list=await api('/store/servers')}catch(e){alert(e.message)}
  const mine=list.filter(s=>s.owner===me.id||!me.admin);
  app().innerHTML=`<header class="top"><span class="brand">Toko</span>
   <a class="btn paper sm" href="/">Buka Panel</a><span class="sp"></span>
   <span class="chip" id="coins">Koin: ${me.coins}</span><span class="chip">${esc(me.username)}${me.admin?' · ADMIN':''}</span>
   <button class="btn red sm" id="out">Keluar</button></header>
   <main class="wrap">
    <h1 style="margin-bottom:6px">Pilih paket</h1>
    <p class="muted" style="margin:0 0 18px">Harga dalam koin. Paket gratis hanya bisa dipakai sekali.</p>
    <div class="grid">${PLANS.map(p=>`<div class="plan"><div class="gb">${esc(p.label)}</div>
      <span class="pr ${p.price?'':'free'}">${p.price?p.price+' koin':'GRATIS'}</span>
      <button class="btn block sm" data-buy="${p.ram}" data-label="${esc(p.label)}" data-price="${p.price}">Buat server</button></div>`).join('')}</div>
    <div class="card"><h2>Server saya</h2>
     <div style="overflow:auto"><table class="tbl"><thead><tr><th>Nama</th><th class="hide-m">Tipe</th><th>Status</th><th class="hide-m">RAM</th><th style="text-align:right">Aksi</th></tr></thead><tbody>
     ${mine.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="muted" style="font-size:12px"><code>${esc(s.id)}</code></div></td>
       <td class="hide-m">${esc(TYPES[s.type||'node'])}</td><td>${badge(s.status)}</td><td class="hide-m">${s.ram} MB</td>
       <td><div class="acts"><a class="btn yellow sm" href="/#/server/${esc(s.id)}">Panel</a>
       <button class="btn green sm" data-pw="start" data-id="${esc(s.id)}">Start</button>
       <button class="btn paper sm" data-pw="stop" data-id="${esc(s.id)}">Stop</button>
       <button class="btn red sm" data-del="${esc(s.id)}" data-name="${esc(s.name)}">Hapus</button></div></td></tr>`).join('')||'<tr><td colspan=5 class="muted" style="text-align:center;padding:20px">Belum ada server</td></tr>'}
     </tbody></table></div></div>
    ${me.admin?'<div class="card" id="adminbox"><h2>Admin: koin pengguna</h2><div id="ausers" class="muted">Memuat...</div></div>':''}
   </main>`;
  $('#out').onclick=async()=>{await api('/logout',{method:'POST',json:{}}).catch(()=>{});me=null;boot()};
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyModal(b.dataset.buy,b.dataset.label,+b.dataset.price));
  document.querySelectorAll('[data-pw]').forEach(b=>b.onclick=async()=>{try{await post(`/servers/${b.dataset.id}/power`,{action:b.dataset.pw});shopView()}catch(e){alert(e.message)}});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus server '+b.dataset.name+'? Tidak bisa dikembalikan.'))return;
    try{await api('/store/servers/'+b.dataset.del,{method:'DELETE'});shopView()}catch(e){alert(e.message)}});
  if(me.admin)adminUsers()}

function buyModal(ram,label,price){
  modal('Buat server '+label,`<div class="field"><label>Nama server</label><input id="bn" placeholder="Contoh: Bot WA saya" maxlength="40"></div>
   <div class="field"><label>Tipe</label><select id="bt"><option value="node">Node.js</option><option value="python">Python</option><option value="web">Web statis</option></select></div>
   <p class="muted" style="margin:0">Biaya: <b>${price?price+' koin':'gratis'}</b>${me.admin?'':' · saldo kamu: '+me.coins}</p>`,
  async m=>{
    const s=await post('/store/create',{ram:+ram,type:m.querySelector('#bt').value,name:m.querySelector('#bn').value.trim()||label});
    m.remove();
    alert('Server dibuat. Kode: '+s.id+'\nBuka panel untuk menjalankan.');
    me.coins=s.coins??me.coins;shopView()},'Buat');
}

async function adminUsers(){
  let users=[];try{users=await api('/users')}catch(e){$('#ausers').textContent=e.message;return}
  $('#ausers').innerHTML=`<div style="overflow:auto"><table class="tbl"><thead><tr><th>User</th><th>Koin</th><th>Ubah</th></tr></thead><tbody>
   ${users.map(u=>`<tr><td><b>${esc(u.username)}</b>${u.admin?' <span class="badge">admin</span>':''}</td><td>${u.coins}</td>
   <td><div class="acts"><input type="number" value="1" style="width:90px" data-amt="${esc(u.id)}"><button class="btn green sm" data-give="${esc(u.id)}">Tambah</button><button class="btn red sm" data-take="${esc(u.id)}">Kurangi</button></div></td></tr>`).join('')}
   </tbody></table></div>`;
  const adj=async(id,sign)=>{const n=+document.querySelector(`[data-amt="${id}"]`).value||0;
    try{await api(`/users/${id}/coins`,{method:'PUT',json:{amount:sign*Math.abs(n)}});adminUsers()}catch(e){alert(e.message)}};
  document.querySelectorAll('[data-give]').forEach(b=>b.onclick=()=>adj(b.dataset.give,1));
  document.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>adj(b.dataset.take,-1))}

boot();
</script>
</body>
</html>
